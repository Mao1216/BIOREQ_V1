<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOREQ | Requerimientos de materiales</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0052cc',
                        primaryHover: '#0043a6',
                        sidebar: '#1e293b',
                        background: '#f3f4f6',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-gray-800 antialiased font-sans h-screen flex overflow-hidden">

    <div id="app" class="w-full h-full flex flex-col md:flex-row">
        <!-- Content will be injected here by JS -->
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <div id="loading-indicator" role="status" aria-live="polite" class="fixed bottom-5 right-5 z-50 flex items-center gap-2 rounded-full border border-gray-200 bg-white/95 px-4 py-2 text-sm text-gray-600 shadow-lg transition-all duration-200 opacity-0 translate-y-2 pointer-events-none">
        <span class="bioreq-spinner h-3.5 w-3.5 rounded-full border-2 border-blue-100 border-t-primary"></span>
        <span id="loading-indicator-label">Actualizando información…</span>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center modal-enter">
        <div id="modal-content" class="bg-white rounded-lg shadow-xl w-11/12 max-w-md p-6"></div>
    </div>

    <!-- Scripts de la Aplicación -->
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
